; MGPU Prism - starter configuration.
; The verified flicker-free recipe (1.1 lineage) as shipped defaults.
; Auto-created beside the add-on on first run; edit freely, every key
; takes effect on the next launch (a few are live per frame).
;
; Deliberately ABSENT keys:
;   DepthTransport - the add-on picks the depth route on evidence ([R343]
;                    in the log). Write the key only to pin it.
;   FrameCap       - no frame cap is applied. Write FrameCap=<n> only if
;                    you want one.
;   MVecSource     - do not force it: MVecSource=3 blocks the game's real
;                    vector routes and frame generation starves (every handoff
;                    arrives without vectors and no frame is generated). The
;                    shipped MVecTap=0 / MVecLearned=99 pair below is the
;                    per-title LEARNED verdict (zero field for NR), not a
;                    forced source - FG still gets its zero field and runs.
;
; Diagnostic keys (Probes, MetaProbe, MVecSweep, EvalTimes, ...) are left
; at their built-in defaults (off) to keep this file about running, not
; measuring.
Depth=1
MVec=3
MVecSealValid=1
MVecHoldD3D12=0
MVecLateProbe=0
MVecLatchOffset=0
; MVecExtractOff=1: on a D3D12 title with no NGX contract the R280 extract
; defers the velocity source until it finds a 4-channel buffer to decode.
; A title whose engine only has 2-channel velocity buffers (R16G16) never
; provides one: the defer holds the stream arm forever and the neural
; window never appears. Off: the census candidate ships at once over the
; barrier route. Contract titles (DLSS games) make the extract inert anyway.
MVecExtractOff=1
; MVecTap=0 + MVecLearned=99: the verified flicker-free recipe (NTE lineage).
; 99 = no buffer of this title passed the R258 warp test - bind the synthetic
; zero field for NR from the arm instead of spending the first launch re-learning
; it (a fresh ini without these keys re-runs the probe and that session flickers).
; FG keeps working: it is fed the same zero field (R16G16).
MVecTap=0
MVecLearned=99
; Frame generation (DLSS FG on the neural card, 4x = three generated frames
; per real one). On titles whose vectors fail verification the bridge feeds FG
; the same consistent zero field NR gets (R16G16) - frame generation keeps
; working and stationary pictures never flicker; motion smears instead.
FrameGen=4
FGX=4
FGMulti=2
FGMvScaleNow=1
FGMvUnit=1
FGSkipCarry=1
FGPace=1
FGSkipJump=0
MVecScaleX=1.0
MVecScaleY=1.0
MVecDX=0.0
MVecDY=0.0
DepthInverted=1
CopyQueue=2
NRScale=0.58
NRScale2=0.48
Calib=2
CalibRung=0
MvecFromEval=2
MVecBarrierSource=2
HistoryGate=1
JitterComp=0
RingWindow=1
Stride=0
Neural=1
Passes=2
Intensity=2.20
Intensity1=2.20
Intensity2=2.20
PrismSync=0
PrismSyncIntensity=1.00
PrismSyncGuard=1.00
PrismSyncFilter=1
NRCadence=1
PrismX1=1
