; MGPU Prism - starter configuration.
; 1.1-lineage baseline; each game still requires its own visual validation.
; Auto-created beside the add-on on first run; edit freely, every key
; takes effect on the next launch (a few are live per frame).
;
; Deliberately ABSENT keys:
;   DepthTransport - the add-on picks the depth route on evidence ([R343]
;                    in the log). Write the key only to pin it.
;   FrameCap       - no frame cap is applied. Write FrameCap=<n> only if
;                    you want one.
;   MVecSource     - do not force it: MVecSource=3 blocks the game's real
;                    vector routes and frame generation starves (every handoff
;                    arrives without vectors and no frame is generated). The
;                    shipped MVecTap=0 / MVecLearned=99 pair below is the
;                    per-title LEARNED verdict (zero field for NR), not a
;                    forced source.
;
; Diagnostic keys (Probes, MetaProbe, MVecSweep, EvalTimes, ...) are left
; at their built-in defaults (off) to keep this file about running, not
; measuring.
Depth=1
MVec=3
MVecSealValid=1
MVecHoldD3D12=0
MVecLateProbe=0
MVecLatchOffset=0
; MVecExtractOff=1: on a D3D12 title with no NGX contract the R280 extract
; defers the velocity source until it finds a 4-channel buffer to decode.
; A title whose engine only has 2-channel velocity buffers (R16G16) never
; provides one: the defer holds the stream arm forever and the neural
; window never appears. Off: the census candidate ships at once over the
; barrier route. Contract titles (DLSS games) make the extract inert anyway.
MVecExtractOff=1
; MVecTap=0 + MVecLearned=99: the verified NTE NR recipe (1.1 lineage).
; 99 = no buffer of this title passed the R258 warp test - bind the synthetic
; zero field for NR from the arm instead of spending the first launch re-learning
; it (a fresh ini without these keys re-runs the probe and that session flickers).
MVecTap=0
MVecLearned=99
; Frame generation: DLSS FG on the neural card; 4x = three generated frames
; per real one. FGPairFlow gives FG an independent motion source below.
FrameGen=4
; Global default: FG estimates current-to-previous motion from final colour
; pairs instead of consuming unverified game vectors. NR keeps its per-title
; vector route. FGPairFlow=0 restores the legacy FG input.
FGPairFlow=1
; Keep the legacy real-vector experiment off; FGPairFlow is the default path.
FGRealMV=0
FGX=4
FGMulti=2
FGMvScaleNow=1
FGMvUnit=1
FGSkipCarry=1
FGPace=1
FGSkipJump=0
MVecScaleX=1.0
MVecScaleY=1.0
MVecDX=0.0
MVecDY=0.0
DepthInverted=1
CopyQueue=2
NRScale=0.58
NRScale2=0.48
; R401: per-pass network scales are FREE - NRScale1/2/3 accept 0.30..4.00
; (above 1.00 = supersampling). The NGX feature is built ONCE at the cap:
; absent NRScaleCap the cap auto-fits the largest requested scale at arm;
; write NRScaleCap=N (1.00..4.00) to give the panel sliders headroom to N.
; Live panel pulls past the built cap clamp with an [R401] log warning.
Calib=2
CalibRung=0
MvecFromEval=2
MVecBarrierSource=2
HistoryGate=1
JitterComp=0
RingWindow=1
Stride=0
Neural=1
Passes=2
Intensity=2.20
Intensity1=2.20
Intensity2=2.20
PrismSync=0
PrismSyncIntensity=1.00
PrismSyncGuard=1.00
PrismSyncFilter=1
NRCadence=1
PrismX1=1
PrismX1Intensity=2.15
PrismX1Guard=1.00
PrismX1DetailKeep=0.85
XeSSFG=0
XeSSMultiplier=2
; TemporalStrength: the Prism 1.1 golden stabiliser (recovered kernel) on the
; final composited picture, percent. 70 is the 1.1 lineage value that ran
; flicker-free; 0 disables. Motion-adaptive: moving pixels are released by a
; neighbourhood clamp, only still pixels are temporally damped.
TemporalStrength=70
TemporalMotionAdaptive=1
; R402: residual domain - the CURRENT game colour is the only base, the
; neural output contributes only a rate-limited residual (TemporalResidDelta).
; 1 = on (shipped default), 0 = the classic golden colour kernel.
TemporalResidual=1
TemporalResidDelta=0.10
PresentQueue=0
Finish=1
FinishLook=5
FinishGuard=1.00
PassReset=0
Tuning=1
ToneStrength=1.0
StructureStrength=1.0
SkinStrength=0.30
Style=0.00
AutoMask=1
Subrect=100
CostCurve=0
SRUpscale=0
SRSnippet=1
SRPreset=0
SRQuality=2
SRScale=0
SRMvLowRes=2
Reflex=0
ReflexSleep=0
ReflexLatency=0
Auto=0
AutoTargetFps=60
AutoArm=1
DcompOverlay=1
Frames=0
CloseGameWithBridge=1
Present=nr
PresentVsync=1
Window=FIT
Monitor=auto
NoActivate=2
SwapGuard=0
DepthCompare=0
Profile=0
DcompFit=auto
DcompSafeMode=3
NRFrameFilter=0
ResidualPass=2
ResidualScale=0.75
SLTags=0
SLTagsMvec=0
SLTagsCapture=0
MVecStepAside=0
MVecProbe=0
MVecProbeIndex=0
